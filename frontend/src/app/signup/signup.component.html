<div class="signup-wrapper">
  <div class="signup-card">
    <h2>📝 Sign Up</h2>
    <form (ngSubmit)="onSignup()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" [(ngModel)]="user.username" name="username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="user.password" name="password" required />
      </div>
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input id="fullname" [(ngModel)]="user.fullname" name="fullname" required />
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input id="phone" [(ngModel)]="user.phone" name="phone" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="user.email" name="email" required />
      </div>


      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" [(ngModel)]="user.role" name="role" required>
          <option value="" disabled selected>Select role</option>
          <option value="student">Student</option>
          <option value="working">Working</option>
          <!-- <option value="admin">Admin</option> -->
        </select>
      </div>

      <button type="submit">Sign Up</button>
    </form>
  </div>
</div>
