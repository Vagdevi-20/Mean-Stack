<div class="expense-list">
  <h2>Expense List</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Category</th>
        <th>Amount (₹)</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let expense of expenses">
        <td>{{ expense.date | date:'short' }}</td>
        <td>{{ expense.category }}</td>
        <td>{{ expense.amount }}</td>
      </tr>
    </tbody>
  </table>
</div>
